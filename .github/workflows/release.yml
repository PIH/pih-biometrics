name: Release new version

on:
  workflow_dispatch:

jobs:
  release:
    if: github.repository_owner == 'PIH'
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'

      # Maven 3.9.x until central-publishing-maven-plugin handles Maven 3.10's release bundle
      - name: Set up Maven
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/setup-maven@main

      - name: Setup Git Config
        run: |
          git config user.name "Github Action"
          git config user.email "github-action@users.noreply.github.com"

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github-pih-artifacts</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GHA_WRITE_TOKEN}</password>
              </server>
              <server>
                <id>sonatype-central</id>
                <username>${env.SONATYPE_USERNAME}</username>
                <password>${env.SONATYPE_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Tests require the real Neurotec native libraries and a valid license file, neither of
      # which belong on a shared hosted runner - see README for how to run them locally.
      - name: Release prepare and perform
        run: mvn -B -DpreparationGoals=clean -Darguments="-Dmaven.test.skip=true" release:prepare release:perform -Prelease --file pom.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHA_WRITE_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release:prepare tagged the release as its version (tagNameFormat @{project.version}), on HEAD's parent.
      - name: Build, test and push the release image
        run: |
          version=$(git describe --tags --abbrev=0 HEAD~1)
          git checkout -q "$version"
          docker/build.sh "ghcr.io/pih/pih-biometrics:$version"
          docker/test.sh "ghcr.io/pih/pih-biometrics:$version"
          docker push "ghcr.io/pih/pih-biometrics:$version"
          git checkout -q -
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHA_WRITE_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}

      # release:prepare bumps the working copy to the next SNAPSHOT and pushes that commit, but
      # never deploys that snapshot itself - deploy it explicitly so it's available right away.
      - name: Deploy next development version
        run: mvn -B clean deploy -Dmaven.test.skip=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHA_WRITE_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
