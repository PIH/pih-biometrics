name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-publish:
    if: github.repository_owner == 'PIH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github-pih-artifacts</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GHA_WRITE_TOKEN}</password>
              </server>
              <server>
                <id>ossrh</id>
                <username>${env.OSSRH_USERNAME}</username>
                <password>${env.OSSRH_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and deploy
        run: mvn -B clean deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHA_WRITE_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}
          OSSRH_USERNAME: ${{ secrets.OPENMRS_MAVEN_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OPENMRS_MAVEN_PASSWORD }}
