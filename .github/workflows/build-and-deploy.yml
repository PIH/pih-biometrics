name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-publish:
    if: github.repository_owner == 'PIH'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github-pih-artifacts</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GHA_WRITE_TOKEN}</password>
              </server>
              <server>
                <id>sonatype-central</id>
                <username>${env.SONATYPE_USERNAME}</username>
                <password>${env.SONATYPE_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Tests require the real Neurotec native libraries and a valid license file, neither of
      # which belong on a shared hosted runner - see README for how to run them locally.
      - name: Build and deploy
        run: mvn -B clean deploy -Dmaven.test.skip=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHA_WRITE_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test and push the image
        run: |
          version=$(mvn -B -q org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)
          image=ghcr.io/pih/pih-biometrics:$version
          docker/build.sh "$image"
          docker/test.sh "$image"
          docker tag "$image" ghcr.io/pih/pih-biometrics:latest
          docker push "$image"
          docker push ghcr.io/pih/pih-biometrics:latest
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHA_WRITE_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}
